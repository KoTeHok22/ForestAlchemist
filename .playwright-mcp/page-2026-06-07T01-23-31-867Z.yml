          - heading "Claude Code Plugin" [level=1] [ref=e77]
          - paragraph [ref=e78]: App UI includes a Claude Code plugin that provides AI-assisted development for building user interfaces. The plugin includes specialized skills that help you write App UI code faster and with fewer errors.
