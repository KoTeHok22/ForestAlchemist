          - paragraph [ref=e81]:
            - link "Claude Code" [ref=e82] [cursor=pointer]:
              - /url: https://code.claude.com/docs
            - text: is a command-line tool that brings AI assistance directly into your development workflow. It can read your codebase, understand context, and help you write, debug, and refactor code.
          - 'heading "Anchor link to section: Installation Installation" [level=2] [ref=e83]':
