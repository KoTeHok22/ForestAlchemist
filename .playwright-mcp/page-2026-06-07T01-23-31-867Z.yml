          - paragraph [ref=e95]: App UI includes a Package Manager extension that lets you install AI Agent skills directly from the Unity Editor.
          - list [ref=e96]:
            - listitem [ref=e97]:
              - text: Open
              - strong [ref=e98]: Window > Package Manager
              - text: in Unity
            - listitem [ref=e99]:
              - text: Select the
              - strong [ref=e100]: App UI
              - text: package
            - listitem [ref=e101]:
              - text: In the package detail pane, expand the
              - strong [ref=e102]: AI Agent Skills
              - text: foldout
            - listitem [ref=e103]:
              - text: Click
              - strong [ref=e104]: Install All
              - text: to install every available skill, or click
              - strong [ref=e105]: Install
              - text: next to individual skills
          - paragraph [ref=e106]:
            - text: The extension copies skill files into your
            - code [ref=e107]: .claude/skills
            - text: directory. It walks up from your project root looking for an existing
            - code [ref=e108]: .claude
            - text: folder; if none is found, it defaults to
            - code [ref=e109]: <project-root>/.claude/skills
            - text: .
          - generic [ref=e110]:
            - heading " Note" [level=5] [ref=e111]
            - paragraph [ref=e112]:
              - text: If no
              - code [ref=e113]: .claude
              - text: folder exists in or above your project, skills are installed relative to the project root. A warning is displayed if the resolved path falls under your home directory (
              - code [ref=e114]: ~/.claude/skills
              - text: ). Consider creating a
              - code [ref=e115]: .claude
              - text: folder in your project to keep skills project-scoped.
          - paragraph [ref=e116]:
            - text: The extension also detects when installed skills are
            - strong [ref=e117]: outdated
            - text: (the package contains newer files) and offers an
            - strong [ref=e118]: Update
            - text: button. You can remove individual skills or use
            - strong [ref=e119]: Remove All
            - text: to uninstall them.
